name: Daily News

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send category news to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python news.py

      - name: Save seen news history
        if: always()
        run: |
          if [ ! -f seen_news.json ]; then
            echo "No history file to commit."
            exit 0
          fi

          git add seen_news.json

          if git diff --cached --quiet -- seen_news.json; then
            echo "No new history to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update seen news history"
          git push
