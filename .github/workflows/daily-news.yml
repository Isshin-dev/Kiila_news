name: Daily News

on:
  workflow_dispatch:

jobs:
  test-slack:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message to Slack
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"KIILA News Bot のテスト送信です。"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
